
nameOverride: ""
fullnameOverride: ""

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/pawrot/wuda/front-end
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  env:
    APP_HOST: "0.0.0.0"
    APP_PORT: "8000"
    BACKEND_HOSTNAME: ""
    BACKEND_PORT: "80"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: frontend.local
        path: /
        pathType: Prefix
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/pawrot/wuda/back-end
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 5000
  env:
    APP_HOST: "0.0.0.0"
    APP_PORT: "5000"
    POSTGRES_DB: "games"
    POSTGRES_USER: "board_games"
    POSTGRES_HOST: ""
    PORT: "5432" # Database port expected by backend code as 'PORT'
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.local
        path: /
        pathType: Prefix
    tls: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

db:
  enabled: true
  image:
    repository: postgres
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  auth:
    database: games
    username: board_games
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

secretValues:
  # Populate these via --set-file or external Secret management
  frontend:
    SECRET_KEY: "please-change-me"
  backend:
    JWT_KEY: "please-change-me"
  db:
    POSTGRES_PASSWORD: "postgres"
