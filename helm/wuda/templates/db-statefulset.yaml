{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wuda.componentName" (list . "db") }}
  labels:
    {{- include "wuda.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "wuda.componentName" (list . "db") }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "wuda.labels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wuda.componentName" (list . "db") }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
  volumeClaimTemplates:
    {{- if .Values.db.persistence.enabled }}
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.db.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}
        {{- if .Values.db.persistence.storageClassName }}
        storageClassName: {{ .Values.db.persistence.storageClassName }}
        {{- end }}
    {{- end }}
{{- end }}
