apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wuda.componentName" (list . "backend") }}
  labels:
    {{- include "wuda.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "wuda.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "wuda.componentName" (list . "db") }} -p 5432 -U {{ .Values.backend.env.POSTGRES_USER }} -d {{.Values.backend.env.POSTGRES_DB}}; do
                echo "Waiting for database to be ready..."
                sleep 2
              done
              echo "Database is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wuda.componentName" (list . "backend") }}
                  key: POSTGRES_PASSWORD
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "wuda.componentName" (list . "backend") }}
            - secretRef:
                name: {{ include "wuda.componentName" (list . "backend") }}
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /liveness
{{/*              readiness always returns 500???*/}}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
