name: Linting

on:
  push:
    branches:
      [master, develop]
  pull_request:
    branches:
      [master, develop]

jobs:
  lint:
    name: code linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: install flake8
        run: pip install flake8

      - name: lint back-end
        run: |
          flake8 back-end/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 back-end/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: lint front-end
        run: |
          flake8 front-end/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 front-end/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

