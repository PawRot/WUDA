name: CI/CD pipeline

on:
  push:
    branches:
      [master, develop]
  pull_request:
    branches:
      [master, develop]

jobs:
  vulnerability-scan:
    name: source vulnerability scan
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v5

      - name: python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.13' # use latest python 3 version

      # use pip-audit to scan dependencies
      - name: pip-audit install
        run: pip install pip-audit

      - name: back-end audit
        run: pip-audit -r back-end/requirements.txt --desc # add description to output

      - name: front-end audit
        run: pip-audit -r front-end/requirements.txt --desc


      # use bandit to scan source code, output in sarif format
      - name: bandit install
        run: pip install bandit[sarif]

      - name: back-end bandit
        run: bandit -r back-end/ -f sarif -o bandit-backend.sarif --exit-zero # exit-zero doesn't fail build, only reports

      - name: upload backend bandit report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-backend.sarif
          category: 'bandit backend'

      - name: front-end bandit
        run: bandit -r front-end/ -f sarif -o bandit-frontend.sarif --exit-zero

      - name: upload frontend bandit report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-frontend.sarif
          category: 'bandit frontend'
  lint:
    name: code linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: install flake8
        run: pip install flake8

      - name: lint back-end
        run: |
          flake8 back-end/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 back-end/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: lint front-end
        run: |
          flake8 front-end/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 front-end/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics



  test-backend:
    name: back-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: python setup
        uses: actions/setup-python@v6
        with:
            python-version: '3.13'

      - name: install dependencies
        working-directory: ./back-end
        run: |
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: run tests
        env:
          POSTGRES_DB: ${{secrets.POSTGRES_DB}}
          POSTGRES_USER: ${{secrets.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{secrets.POSTGRES_PASSWORD}}
          POSTGRES_HOST: ${{secrets.POSTGRES_HOST}}
          PORT: ${{secrets.PORT}}
          JWT_KEY: ${{secrets.JWT_KEY}}
          APP_PORT: ${{secrets.APP_PORT}}
        working-directory: ./back-end
        run: pytest test_app.py -v
  test-frontend:
    name: front-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: install dependencies
        working-directory: ./front-end
        run: |
          pip install -r requirements.txt
          pip install -r requirements_test.txt

      - name: run tests
        env:
          BACKEND_HOSTNAME: ${{secrets.BACKEND_HOSTNAME}}
          BACKEND_PORT: ${{secrets.BACKEND_PORT}}
          SECRET_KEY: ${{secrets.SECRET_KEY}}
          SERVER_PORT: ${{secrets.SERVER_PORT}}
        working-directory: ./front-end
        run: pytest test_app.py -v
  build-push-backend:
    name: build and push back-end image
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, lint, test-backend]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/back-end
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value= ${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push back-end image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # scanning built image with trivy
      - name: run trivy back-end scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}/back-end:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-backend-image.sarif'

      - name: upload trivy back-end scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend-image.sarif
          category: 'trivy back-end'
  build-push-frontend:
    name: build and push front-end image
    runs-on: ubuntu-latest
    needs: [ vulnerability-scan, lint, test-frontend ]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/front-end
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value= ${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push front-end image
        uses: docker/build-push-action@v4
        with:
          context: ./front-end
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # scanning built image with trivy
      - name: run trivy front-end scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}/front-end:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend-image.sarif'

      - name: upload trivy front-end scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend-image.sarif
          category: 'trivy front-end'