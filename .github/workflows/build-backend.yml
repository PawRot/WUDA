name: Build Backend

on:
  workflow_run:
    workflows: ["Security Scanning", "Linting", "Tests"]
    types:
      - completed
    branches:
      [master, develop]

jobs:
  build-push-backend:
    name: build and push back-end image
    runs-on: ubuntu-latest
    # Only run if all prerequisite workflows succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/back-end
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value= ${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push back-end image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: lowercase repository name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # scanning built image with trivy
      - name: run trivy back-end scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}/back-end:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-backend-image.sarif'

      - name: upload trivy back-end scan
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend-image.sarif
          category: 'trivy back-end'

